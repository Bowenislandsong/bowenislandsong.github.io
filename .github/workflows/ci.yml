name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run full test suite
        run: python3 -m unittest discover -s test -q

  ui-contracts:
    name: UI contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run UI contract tests
        run: python3 -m unittest test.test_ui_contracts -q

  static-site-smoke:
    name: Static site smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start static server and verify key pages
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8000/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/sections/personal.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/sections/research.html >/dev/null

<!-- Paper Discovery Section -->
<section class="relative min-h-screen">
  <!-- Background gradient -->
  <div class="absolute inset-0 -z-10 bg-gradient-to-br from-emerald-50 via-white to-teal-50/30"></div>
  
  <div class="max-w-6xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="mb-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl">📚</span>
        <div>
          <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900">Paper Discovery</h1>
          <p class="text-slate-600 mt-1">Research landscape: GRF estimation from wearable IMUs — classified, connected, visualized</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-2">
        <span class="inline-flex items-center rounded-full bg-emerald-100 border border-emerald-200 px-3 py-1.5 text-sm font-semibold text-emerald-800">🤖 AI Summaries</span>
        <span class="inline-flex items-center rounded-full bg-blue-100 border border-blue-200 px-3 py-1.5 text-sm font-semibold text-blue-800">🔗 Idea Graph</span>
        <span class="inline-flex items-center rounded-full bg-purple-100 border border-purple-200 px-3 py-1.5 text-sm font-semibold text-purple-800">🏷️ By Topic</span>
        <span class="inline-flex items-center rounded-full bg-amber-100 border border-amber-200 px-3 py-1.5 text-sm font-semibold text-amber-800">📅 Timeline</span>
      </div>
    </div>

    <!-- View Switcher + Topic Filter -->
    <div class="mb-4 flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">
      <!-- View toggle -->
      <div class="flex rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden text-sm font-medium" role="group" aria-label="View selector">
        <button id="view-cards" class="px-4 py-2 bg-emerald-600 text-white transition-colors" onclick="window.papersSetView('cards')">🃏 Cards</button>
        <button id="view-graph" class="px-4 py-2 text-slate-600 hover:bg-slate-50 transition-colors border-l border-slate-200" onclick="window.papersSetView('graph')">🔗 Graph</button>
        <button id="view-topic" class="px-4 py-2 text-slate-600 hover:bg-slate-50 transition-colors border-l border-slate-200" onclick="window.papersSetView('topic')">🏷️ By Topic</button>
        <button id="view-timeline" class="px-4 py-2 text-slate-600 hover:bg-slate-50 transition-colors border-l border-slate-200" onclick="window.papersSetView('timeline')">📅 Timeline</button>
      </div>
      <!-- Paper count -->
      <span id="papers-count" class="text-sm text-slate-500"></span>
    </div>

    <!-- Topic filter pills -->
    <div id="topic-filter-bar" class="mb-5 flex flex-wrap gap-2"></div>

    <!-- Cards View -->
    <div id="papers-browser" class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      <div class="col-span-full text-center py-12">
        <div class="inline-flex items-center gap-2 text-slate-500">
          <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Loading papers...
        </div>
      </div>
    </div>

    <!-- Graph View (hidden by default) -->
    <div id="papers-graph-view" class="hidden">
      <div class="rounded-2xl border border-slate-200 bg-white shadow-lg overflow-hidden">
        <div class="px-5 py-3 border-b border-slate-100 flex items-center gap-2 text-sm text-slate-600">
          <span class="font-semibold">Idea Connection Graph</span>
          <span class="text-slate-400">— nodes = papers, colors = research theme, edges = shared ideas. Click a node to see details.</span>
        </div>
        <div class="relative" style="height:520px">
          <canvas id="papers-graph-canvas" style="width:100%;height:100%;display:block;cursor:grab;"></canvas>
          <!-- Tooltip -->
          <div id="graph-tooltip" class="hidden absolute pointer-events-none bg-white border border-slate-200 rounded-xl shadow-lg p-3 max-w-xs text-xs z-10"></div>
        </div>
        <!-- Legend -->
        <div id="graph-legend" class="px-5 py-3 border-t border-slate-100 flex flex-wrap gap-3 text-xs"></div>
      </div>
      <!-- Detail panel shown on node click -->
      <div id="graph-detail" class="hidden mt-4 rounded-2xl border border-slate-200 bg-white shadow-lg p-5"></div>
    </div>

    <!-- By-Topic View (hidden by default) -->
    <div id="papers-topic-view" class="hidden space-y-8"></div>

    <!-- Timeline View (hidden by default) -->
    <div id="papers-timeline-view" class="hidden"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/papers.js"></script>

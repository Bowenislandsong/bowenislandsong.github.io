<!-- Paper Discovery Section -->
<section class="relative min-h-screen">
  <!-- Background gradient -->
  <div class="absolute inset-0 -z-10 bg-gradient-to-br from-emerald-50 via-white to-teal-50/30"></div>
  
  <div class="max-w-6xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="mb-8">
      <div class="flex items-center gap-3 mb-4">
        <span class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl">
          📚
        </span>
        <div>
          <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900">Paper Discovery</h1>
          <p class="text-slate-600 mt-1">Latest research papers discovered daily, with AI-generated summaries</p>
        </div>
      </div>
      
      <!-- Feature pills -->
      <div class="flex flex-wrap gap-2">
        <span class="inline-flex items-center rounded-full bg-emerald-100 border border-emerald-200 px-3 py-1.5 text-sm font-semibold text-emerald-800">🤖 AI Summaries</span>
        <span class="inline-flex items-center rounded-full bg-blue-100 border border-blue-200 px-3 py-1.5 text-sm font-semibold text-blue-800">📅 Updated Daily</span>
        <span class="inline-flex items-center rounded-full bg-purple-100 border border-purple-200 px-3 py-1.5 text-sm font-semibold text-purple-800">🔬 Related Research</span>
        <span class="inline-flex items-center rounded-full bg-amber-100 border border-amber-200 px-3 py-1.5 text-sm font-semibold text-amber-800">🏷️ Tagged & Organized</span>
      </div>
    </div>

    <!-- Papers Grid -->
    <div id="papers-browser" class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      <!-- Loading state -->
      <div class="col-span-full text-center py-12">
        <div class="inline-flex items-center gap-2 text-slate-500">
          <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Loading papers...
        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/papers.js"></script>

<!-- sections/news.html -->

<section id="news-overview" class="py-10 md:py-14">
  <p class="text-xs font-semibold uppercase tracking-[0.22em] text-teal-700">News</p>
  <h1 class="mt-4 text-4xl font-semibold tracking-tight text-slate-950 md:text-5xl">
    Posters, talks, and public milestones.
  </h1>
  <p class="mt-5 max-w-3xl text-lg leading-8 text-slate-700">
    Newest first. Featured updates stay on top, recent items stay searchable, older items move into the archive.
  </p>
</section>

<section id="featured" class="scroll-mt-24 py-10">
  <h2 class="text-3xl font-semibold tracking-tight text-slate-950">Featured.</h2>
  <div id="news-featured-shell" class="mt-6"></div>
</section>

<section id="latest" class="scroll-mt-24 py-10">
  <div class="flex flex-col gap-5 xl:flex-row xl:items-end xl:justify-between">
    <div class="max-w-2xl">
      <h2 class="text-3xl font-semibold tracking-tight text-slate-950">Recent updates.</h2>
      <p class="mt-3 text-base leading-7 text-slate-600">
        Search by title, topic, event, or tag.
      </p>
    </div>

    <div class="w-full max-w-xl rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
      <label for="news-search" class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Search updates</label>
      <input
        id="news-search"
        type="search"
        placeholder="Search posters, talks, topics, or keywords"
        class="mt-3 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-teal-400 focus:bg-white focus:ring-2 focus:ring-teal-100"
      />
      <p class="mt-3 text-sm text-slate-500"><span id="news-count" class="font-semibold text-slate-900">0</span> matching update(s)</p>
    </div>
  </div>

  <div id="news-current-list" class="mt-6 grid gap-4"></div>
</section>

<section id="archive" class="scroll-mt-24 py-10">
  <h2 class="text-3xl font-semibold tracking-tight text-slate-950">Archive.</h2>
  <p class="mt-3 max-w-2xl text-base leading-7 text-slate-600">
    Past talks and milestones, grouped by year.
  </p>
  <div id="news-archive-groups" class="mt-6 space-y-6"></div>
</section>
